# Eco-first policy — identical on AC and battery (owner's call: chassis is
# thermally capped, curbing peak boost wins both watts and sustained perf).
# Managed by session 022 (2026-09-23). Rollback: delete this file + systemctl restart tlp

# --- CPU (amd-pstate active / EPP) ---
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_DRIVER_OPMODE_ON_SAV=active
# MUST stay powersave: the TLP default ("performance") would pin max clocks on amd-pstate-epp
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=dynamic
CPU_ENERGY_PERF_POLICY_ON_BAT=dynamic
CPU_ENERGY_PERF_POLICY_ON_SAV=dynamic
# Boost stays on. Max-freq ceiling is applied per-core-class by eco-power.sh
# (Zen5 only — CPU_MAX_PERF here would wrongly throttle the Zen5c cluster too).
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=1
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=100
CPU_MAX_PERF_ON_SAV=100

# --- Platform profile: asusd SOLE owner. Empty = TLP does not manage (any write,
# even of the same value, makes the EC reset SMU limits and EPP — verified). ---
PLATFORM_PROFILE_ON_AC=
PLATFORM_PROFILE_ON_BAT=
PLATFORM_PROFILE_ON_SAV=

# --- GPU (Radeon 890M): driver-supported knobs only ---
# power_dpm_state writes are silently ignored on this kernel (verified rc=0, no effect)
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=auto
RADEON_DPM_PERF_LEVEL_ON_SAV=low
# ABM: adaptive backlight management, panel-side watts (0=off, 1-3 = increasing saving)
AMDGPU_ABM_LEVEL_ON_AC=1
AMDGPU_ABM_LEVEL_ON_BAT=1
AMDGPU_ABM_LEVEL_ON_SAV=3

# --- Buses / devices ---
PCIE_ASPM_ON_AC=powersave
PCIE_ASPM_ON_BAT=powersave
PCIE_ASPM_ON_SAV=powersave
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
# amdgpu removed from the default denylist (Radeon 890M runtime PM is the idle win)
RUNTIME_PM_DRIVER_DENYLIST="nouveau nvidia"
SATA_LINKPWR_ON_AC="med_power_with_dipm"
SATA_LINKPWR_ON_BAT="med_power_with_dipm"
USB_AUTOSUSPEND=1

# --- Radios / audio ---
WIFI_PWR_ON_AC=on
WIFI_PWR_ON_BAT=on
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
