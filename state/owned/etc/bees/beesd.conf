# Created 2026-10-05 by the system-tuning converge flow (bees-switch work item).
# Owner decision 2026-10-05: retire duperemove entirely, dedupe via bees; runtime model
# is upstream-default continuous throttled daemon, so every other knob stays at the
# upstream default (see /etc/bees/beesd.conf.sample). Instance %i of beesd@.service is
# the btrfs filesystem UUID; beesd greps /etc/bees/*.conf for this UUID.
UUID=521bbdbd-77e2-4a70-a8f7-9bda99558cde

# bees 0.11 defaults to --verbose 8 (every crawl/ref/hash line, ~57k journal lines/day at
# P7+P6; measured 2026-10-13). Cap at 5: keeps notices/warnings/errors + bees exception traces
# (~85/day), drops the progress chatter. The unit-level LogRateLimit drop-in stays as backstop.
# Added 2026-10-14 (owner-approved 2026-10-13; live hand-edit was reverted by converge 2026-10-13 21:32).
OPTIONS="--verbose 5"
