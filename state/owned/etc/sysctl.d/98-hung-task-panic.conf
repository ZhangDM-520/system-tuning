# Freeze forensics: a task wedged this long means this host is already lost to the user
# (lid-resume hard freezes end in a power-button reset). Panic instead so the armed
# efi_pstore backend captures the blocked-task stacks (docs/findings.md ## suspend-resume).
# 300 s bar, not the 120 s default (risk pass 2026-10-08): the only hung_task pstore record
# fired at 122 s of D-state in the cs35l56 firmware-reload path — i.e. right at the default
# line, where a slow-but-alive stall would have been panicked into a data-losing reset.
# Panic now needs an unambiguous wedge; the forensics intent is unchanged.
kernel.hung_task_timeout_secs = 300
kernel.hung_task_panic = 1
