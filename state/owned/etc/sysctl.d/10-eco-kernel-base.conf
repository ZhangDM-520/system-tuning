# Adopted 2026-11-09 from cachyos-settings 1:1.4.1
# (/usr/lib/sysctl.d/70-cachyos-settings.conf). The package is being dropped: its hard
# dependency ananicy-cpp conflicts with aranicy (docs/findings.md ## vendor-settings).
#
# These are carried-over live values, not a tuning claim: the host ran exactly this set
# before adoption, and dropping the package would silently revert every one of them
# (vfs_cache_pressure 100, page-cluster 3, nmi_watchdog 1, kptr_restrict 0, and so on).
#
# 10- sorts before every other owned sysctl file, so 95/97/98/99 still win. Two vendor keys
# are deliberately NOT carried:
#   vm.swappiness=100      -> 95-zram-swappiness.conf (150, the zram value; findings ## io-stack)
#   kernel.sysrq=1         -> 97-sysrq.conf            (190, capture+rescue mask; ## recovery)
#
# vm.dirty_bytes/dirty_background_bytes are the writeback *volume* caps and coexist with
# 99-eco-writeback.conf's 6000-centisec timers — that pair is the live combination, and
# both were already applied that way (findings ## writeback ## Foreign state).
vm.vfs_cache_pressure = 50
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.page-cluster = 0
kernel.nmi_watchdog = 0
kernel.unprivileged_userns_clone = 1
kernel.printk = 3 3 3 3
kernel.kptr_restrict = 2
net.core.netdev_max_backlog = 4096
fs.file-max = 2097152
