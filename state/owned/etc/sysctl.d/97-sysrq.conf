# Freeze forensics: the 2026-09-29 lid-resume freeze logged "sysrq: This sysrq operation is disabled"
# at the user's keypresses; T (task dump) must work for a mere stall.
# 190 = 2|4|8|16|32|128 — console-log, keyboard, dumps (p/t/m/l: the forensics), sync (s) +
# remount-ro (u) + reboot/poweroff (b/o): the freeze-rescue path. Not 1: bit 64 (e/i/f mass
# process signalling) is dropped, so one accidental chord cannot kill the whole session, and a
# future "enable all" can never grow new destructive keys unnoticed. Narrowed from 1 on
# 2026-10-08 (risk pass); 438 was rejected earlier because it lacks the 0x08 dump group.
kernel.sysrq = 190
