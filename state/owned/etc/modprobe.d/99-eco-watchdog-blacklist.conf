# Adopted 2026-11-09 from cachyos-settings (usr/lib/modprobe.d/blacklist.conf).
# Hardware watchdog timers keep a timer armed and fire NMIs; none of them is needed here
# (freeze detection is kernel.hung_task_panic + the armed efi_pstore backend, findings
# ## suspend-resume). Verified absent from lsmod on the pre-adoption host.
# Live readback: lsmod | grep -E 'iTCO_wdt|sp5100_tco|wdat_wdt'  (expect nothing)
blacklist iTCO_wdt
blacklist sp5100_tco
blacklist wdat_wdt
