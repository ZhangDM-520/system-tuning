# Adopted 2026-11-09 from cachyos-settings (usr/lib/tmpfiles.d/thp-shrinker.conf).
# khugepaged/max_ptes_none: split a THP that has more than 409 of 512 zero-filled pages
# (kernel default 511). With THP=always this returns sparsely-accessed memory to something
# close to madvise usage without losing the base-page collapse win.
# Live readback: cat /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409
