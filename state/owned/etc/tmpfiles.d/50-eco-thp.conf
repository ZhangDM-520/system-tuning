# Adopted 2026-11-09 from cachyos-settings (usr/lib/tmpfiles.d/thp.conf), rewritten to the
# next boot's runtime state. THP defrag=defer+madvise stops khugepaged from compacting
# synchronously for every allocation (tcmalloc guidance) — a latency knob, not a power one.
# Live readback: cat /sys/kernel/mm/transparent_hugepage/defrag
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
