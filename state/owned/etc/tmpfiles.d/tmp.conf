# /etc/tmpfiles.d/tmp.conf
# Override /usr/lib/tmpfiles.d/tmp.conf for persistent /tmp: wipe at boot like tmpfs, run periodic GC

# Wipe /tmp contents on boot (--boot)
D! /tmp 1777 root root 0

# Protect filesystem root-level lost+found
x /tmp/lost+found

# Runtime GC: expire files not accessed/modified within 10 days
e /tmp - - - 10d

# Standard cleanup for /var/tmp
q /var/tmp 1777 root root 30d
