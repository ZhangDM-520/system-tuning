# Local zram configuration for zram-generator.conf(5).
# This /etc main file outranks the vendor file /usr/lib/systemd/zram-generator.conf;
# it must therefore carry every option (nothing is inherited from the vendor file).
# Layout rationale (2026-10-12): ~/docs/NOTE.md.

[zram0]
compression-algorithm = zstd
# Oversized swap: zram holds compressed pages, so virtual size may exceed RAM.
zram-size = ram * 3
# Incompressible pages are evicted to this dedicated partition. The partition
# carries GPT NO_AUTO and must never be swapon'd: zram treats it as raw block store.
writeback-device = /dev/nvme0n1p3
fs-type = swap
swap-priority = 100
