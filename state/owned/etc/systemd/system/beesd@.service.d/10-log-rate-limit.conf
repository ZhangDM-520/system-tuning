# beesd progress chatter (dedup:/scan:/hash_writeback lines) bursts to ~34 msg/s during a crawl —
# on 2026-10-08 that rotated journald's 6.5M files every ~2 min and cost kernel evidence plus the
# older boot journals (docs/JOURNAL.md 2026-10-08). Rate-limit this unit's log only: bees' work is
# untouched, just the journal intake. Journal evidence is load-bearing for freeze forensics.
[Service]
LogRateLimitIntervalSec=30s
LogRateLimitBurst=300
