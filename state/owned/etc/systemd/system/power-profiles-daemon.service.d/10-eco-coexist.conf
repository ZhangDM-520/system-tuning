# PPD + TLP coexistence (owner 2026-10-30): power-profiles-daemon owns the profile/EPP path,
# TLP keeps the rest and self-defers EPP to PPD (10-tlp-func-cpu nop_ppd_active). The stock
# unit's Conflicts=tlp.service is symmetric — starting either side TERMs the other mid-run and
# fires TLP's ExecStop=tlp init stop shutdown phase (observed 2026-10-30). The Conflicts line
# itself is neutered by the managed record `ppd-conflict` (a drop-in `Conflicts=` does NOT clear
# a vendor list on systemd 262); this drop-in only orders TLP's one-shot boot pass first.
[Unit]
After=tlp.service
