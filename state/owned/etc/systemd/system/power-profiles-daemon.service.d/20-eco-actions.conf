# Converged by eco from state/owned (system-tuning repo). Ledger: docs/findings.md ## epp.
# PPD's action flags are runtime-only: `configure-action` does not persist to
# state.ini and a PPD restart reverts them (verified 2026-11-03). Re-assert after
# every PPD start so the GPU power actions and battery-awareness survive restarts
# and reboots. `-` keeps the profile path fail-soft (a CLI hiccup can never fail
# the unit). Runtime readback: `powerprofilesctl list-actions`.
[Service]
ExecStartPost=-/usr/bin/powerprofilesctl configure-action trickle_charge --enable
ExecStartPost=-/usr/bin/powerprofilesctl configure-action amdgpu_panel_power --enable
ExecStartPost=-/usr/bin/powerprofilesctl configure-action amdgpu_dpm --enable
ExecStartPost=-/usr/bin/powerprofilesctl configure-battery-aware --enable
