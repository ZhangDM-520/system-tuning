# Adopted 2026-11-09 from cachyos-settings (usr/lib/systemd/system/system.slice.d/).
# systemd-oomd kills on swap pressure or 80% memory pressure; with a zram swap whose
# virtual size is 3x RAM (state/owned/etc/systemd/zram-generator.conf) the swap-pressure
# trigger has to be armed here or the slice is never a candidate.
[Slice]
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=80%
