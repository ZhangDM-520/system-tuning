# Adopted + fixed 2026-11-09 (docs/findings.md ## journald).
# The forensics budget is 256M (AGENTS.md: a 32M cap vacuumed a whole freeze boot).
# /etc/systemd/journald.conf already carried 256M, but cachyos-settings shipped
# /usr/lib/systemd/journald.conf.d/00-journal-size.conf with 50M, and drop-ins are applied
# *after* the main file — so the effective value was 50M while the managed line read 256M.
# Naming this 99- makes the intent win the drop-in layer regardless of what /usr/lib ships.
[Journal]
SystemMaxUse=256M
