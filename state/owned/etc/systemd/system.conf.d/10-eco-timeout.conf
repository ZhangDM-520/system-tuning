# Adopted 2026-11-09 from cachyos-settings (usr/lib/systemd/system.conf.d/00-timeout.conf).
# Fail-fast boot/shutdown. oneshot units are unaffected (their TimeoutStartSec defaults to
# infinity), which is why eco-power.service's apply step is safe under this.
[Manager]
DefaultTimeoutStartSec=15s
DefaultTimeoutStopSec=10s
